name: yandex-positions-ikigaiauto-vl-submit

on:
  schedule:
    # 00:05 МСК = 21:05 UTC (по факту срабатывает repository_dispatch ниже,
    # cron-job.org задача настроена на 21:05 UTC — этот schedule как доп. шанс).
    # Идемпотентно: submit пропускает ключи, уже отправленные (есть в state).
    # ⚠️ 21-22.11.2026: GitHub НИ РАЗУ не запустил этот schedule за всю ночь
    # (ни основной слот, ни добавленный в ту же ночь фоллбэк) — известная
    # ненадёжность schedule-триггера (см. доступы/Poziccii_Search_API.md §11,
    # задержки от 10 мин до 6.5ч наблюдались и раньше на других сайтах).
    # Поэтому ОСНОВНОЙ способ запуска теперь — repository_dispatch ниже
    # (через внешний будильник cron-job.org, бьёт мгновенно, минуя очередь
    # schedule). Эта строка — просто доп. шанс, не единственная надежда.
    - cron: '0 21 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ikigaiauto-vl-nightly-submit]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '75'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-vl/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-vl/state tools/yandex-positions-ikigaiauto-vl/queue
          git commit -m "ikigaiauto-vl positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '75'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-vl/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-vl/results
          git commit -m "ikigaiauto-vl positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
