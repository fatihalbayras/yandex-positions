name: yandex-positions-ikigaiauto-pm-submit

on:
  schedule:
    # 01:30 МСК = 22:30 UTC (cron-job.org реально бьёт в 01:35 МСК/22:35 UTC).
    # Сдвиг от vl (00:05) и ys (00:45) — общий ключ rf-konsalt.
    # ⚠️ 21-22.11.2026: schedule не сработал ни разу всю ночь — см. vl-submit.yml.
    # Основной способ запуска — repository_dispatch ниже.
    - cron: '30 22 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ikigaiauto-pm-nightly-submit]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '50'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-pm/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-pm/state tools/yandex-positions-ikigaiauto-pm/queue
          git commit -m "ikigaiauto-pm positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '50'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-pm/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-pm/results
          git commit -m "ikigaiauto-pm positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
