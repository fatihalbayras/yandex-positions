name: yandex-positions-runico-collect

on:
  schedule:
    # 05:50 МСК = 02:50 UTC (async обрабатывается 5+ минут, результаты живут 8-12 ч)
    - cron: '50 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results (parallel)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'runico.ru'
        run: python tools/yandex-positions-runico/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-runico/results
          git commit -m "runico positions: collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
