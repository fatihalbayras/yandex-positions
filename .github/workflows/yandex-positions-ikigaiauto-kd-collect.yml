name: yandex-positions-ikigaiauto-kd-collect

# Город: Краснодар (регион 35). Добавочный collect на случай, если async-
# операции из submit (раннего collect через +5 мин) не успели — результаты
# async живут 8-12 ч. Запуск вручную (workflow_dispatch), без постоянного
# cron (правило проекта — без авто-ночных триггеров без активной задачи).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results (parallel)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '35'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-kd/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-kd/results
          git commit -m "ikigaiauto-kd positions: collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
