name: yandex-positions-onlineastrolog-submit

on:
  # Расписание убрано 22.11.2026 — задача (641 ключ LSI-находки), из-за которой
  # cron включали 20.11, полностью закрыта (results: done=2308/2308, pending=0
  # на 21.11). Забыли выключить вовремя — сработало само без команды пользователя,
  # хотя правило проекта: повторные сборы — только по прямой команде. Вернуть
  # строку ниже, когда появится новая задача (новые ключи в keywords.txt/queue):
  # schedule:
  #   - cron: '10 21 * * *'  # 00:10 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'onlineastrolog.ru'
        run: python tools/yandex-positions-onlineastrolog/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-onlineastrolog/state tools/yandex-positions-onlineastrolog/queue
          git commit -m "onlineastrolog positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'onlineastrolog.ru'
        run: python tools/yandex-positions-onlineastrolog/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-onlineastrolog/results
          git commit -m "onlineastrolog positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
