name: yandex-positions-senatcars-collect

on:
  schedule:
    # 05:05 МСК = 02:05 UTC (async-запросы обрабатываются 5+ минут, результаты хранятся 12 ч)
    - cron: '5 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py collect
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-senatcars/results
          git commit -m "positions: collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
