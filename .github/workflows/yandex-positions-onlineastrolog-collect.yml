name: yandex-positions-onlineastrolog-collect

on:
  # Расписание убрано 22.11.2026 — см. submit.yml: задача закрыта, cron забыли
  # выключить. Вернуть, когда появится новая задача:
  # schedule:
  #   - cron: '10 2 * * *'  # 05:10 МСК
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results (parallel)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'onlineastrolog.ru'
        run: python tools/yandex-positions-onlineastrolog/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-onlineastrolog/results
          git commit -m "onlineastrolog positions: collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
