name: yandex-positions-runico-submit

on:
  schedule:
    # 00:50 МСК = 21:50 UTC (отложенный режим Search API: окно 00:00-06:00 МСК).
    # Идемпотентно: submit пропускает ключи, уже отправленные (есть в state) —
    # когда семантика полностью собрана, этот прогон просто ничего не делает.
    - cron: '50 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'runico.ru'
        run: python tools/yandex-positions-runico/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-runico/state tools/yandex-positions-runico/queue
          git commit -m "runico positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '213'
          YP_SITE: 'runico.ru'
        run: python tools/yandex-positions-runico/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-runico/results
          git commit -m "runico positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
