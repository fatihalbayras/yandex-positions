name: yandex-positions-atlas-collect

on:
  schedule:
    # 04:40 МСК = 01:40 UTC (async обрабатывается 5+ минут, результаты хранятся 12 ч;
    # сдвиг от senatcars, тот же API-ключ)
    - cron: '40 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '63'
          YP_SITE: 'atlas-online.ru'
        run: python tools/yandex-positions-atlas/positions.py collect
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-atlas/results
          git commit -m "positions(atlas): collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
