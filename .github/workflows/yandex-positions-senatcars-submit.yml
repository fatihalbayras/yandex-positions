name: yandex-positions-senatcars-submit

on:
  schedule:
    # 00:05 МСК = 21:05 UTC (отложенный режим Search API доступен 00:00-06:00 МСК)
    - cron: '5 21 * * *'
  workflow_dispatch:
  repository_dispatch:
    # мгновенный внешний триггер (дёргается ПК/внешним сервисом) — не зависит от очереди cron GitHub
    types: [nightly-submit]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py submit
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-senatcars/state tools/yandex-positions-senatcars/queue
          git commit -m "positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push

      - name: Wait for async processing
        run: sleep 300
      - name: Collect results (early grab)
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py collect
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-senatcars/results
          git commit -m "positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
