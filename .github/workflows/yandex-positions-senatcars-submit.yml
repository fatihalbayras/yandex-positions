name: yandex-positions-senatcars-submit

on:
  # schedule снят 23.11.2026 (отправка 23.11 выполнена, будильник cron-job.org 8894868 отключён; ПРОЧТИ-МЕНЯ §19.12) — вернуть при новой задаче:
  # schedule:
  #   # резервный слот 03:30 МСК = 00:30 UTC: срабатывает только если основной dispatch-запуск
  #   # (внешний будильник cron-job.org -> repository_dispatch, 3:00 МСК, мгновенно) не состоялся;
  #   # при живом state (submit уже сходил) — no-op
  #   - cron: '30 0 * * *'
  workflow_dispatch:
  repository_dispatch:
    # основной мгновенный триггер (внешний cron-сервис) — вне очереди schedule GitHub
    types: [nightly-submit]

concurrency:
  group: senatcars-submit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_ANATOR }}
          YANDEX_FOLDER_ID: b1gv617qg15rlnphjoil  # аккаунт Anator-rf (23.11.2026)
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-senatcars/state tools/yandex-positions-senatcars/queue
          git commit -m "positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_ANATOR }}
          YANDEX_FOLDER_ID: b1gv617qg15rlnphjoil  # аккаунт Anator-rf (23.11.2026)
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py collect
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-senatcars/results
          git commit -m "positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
