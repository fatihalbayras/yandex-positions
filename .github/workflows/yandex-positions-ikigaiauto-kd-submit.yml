name: yandex-positions-ikigaiauto-kd-submit

# Город: Краснодар (Яндекс-регион 35). Добавлено 26.11.2026 по команде
# пользователя, в пределах ночного окна Search API (00:00-06:00 МСК).
# Регулярный cron НЕ ставим (правило проекта — сбор ТОЛЬКО по команде,
# см. feedback-positions-cloud-execution): запуск — push в эту папку
# (путь ниже) или workflow_dispatch.
# ⚠️ 26.11.2026: целевой сайт исправлен на vladdiler.ru (пользователь
# изначально не назвал сайт, по умолчанию стояло ikigaiauto.ru — ошибка).
# Папка/имена инстанса остались "ikigaiauto-kd" по историческим причинам
# (переименование рискованно для уже запущенного прогона) — переименовать
# при следующей спокойной правке. Запросы — из ikigaiauto.ru\Ноябрь\
# хорошие_Запросы.xls, но YP_SITE ниже — vladdiler.ru.

on:
  push:
    branches: [main]
    paths:
      - 'tools/yandex-positions-ikigaiauto-kd/keywords.txt'
      - 'tools/yandex-positions-ikigaiauto-kd/queue/**'
  workflow_dispatch:

concurrency:
  group: ikigaiauto-kd-submit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '35'
          YP_SITE: 'vladdiler.ru'
        run: python tools/yandex-positions-ikigaiauto-kd/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-kd/state tools/yandex-positions-ikigaiauto-kd/queue
          git commit -m "ikigaiauto-kd positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '35'
          YP_SITE: 'vladdiler.ru'
        run: python tools/yandex-positions-ikigaiauto-kd/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-kd/results
          git commit -m "ikigaiauto-kd positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
