name: yandex-positions-senatcars-submit-fallback3

# Резервный прогон submit: GitHub периодически задерживает cron на 10-60 минут.
# Основной (00:05 МСК) не дождался — сработает этот (01:41 МСК, окно async ещё открыто).
# Скрипт идемпотентен: повторный submit мёржится с state, уже отправленные ключи пропускает.

on:
  schedule:
    # 03:27 МСК = 00:27 UTC (четвёртый шанс; окно async до 06:00 МСК)
    - cron: '27 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/positions.py submit
      - name: Commit state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-senatcars/state tools/yandex-positions-senatcars/queue
          git commit -m "positions: submit fallback3 $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
