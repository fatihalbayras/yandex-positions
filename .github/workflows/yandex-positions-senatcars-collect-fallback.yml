name: yandex-positions-senatcars-collect-fallback

# Резервный прогон collect: если основной (05:05 МСК) задержался/не сработал.
# Результаты async живут 12 часов — этот прогон успевает в любому случае.
# Повторный collect безвреден: догружает только недостающее и перезаписывает тем же.

on:
  schedule:
    # 03:30 МСК = 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect async position results
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '75'
          YP_SITE: 'senatcars.ru'
        run: python tools/yandex-positions-senatcars/collect_parallel.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase || true
          git add tools/yandex-positions-senatcars/results
          git commit -m "positions: collect fallback $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push
