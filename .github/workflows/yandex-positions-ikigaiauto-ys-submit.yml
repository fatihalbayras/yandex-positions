name: yandex-positions-ikigaiauto-ys-submit

on:
  schedule:
    # 02:10 МСК = 23:10 UTC (отложенный режим Search API: окно 00:00-06:00 МСК).
    # Сдвиг от ikigaiauto-vl (00:15) и других сайтов — общая квота 1 запрос/сек на API-ключ.
    - cron: '10 23 * * *'
    # Фоллбэк на сегодня (21.11.2026): соседний слот vl не сработал по расписанию
    # (GitHub задержал schedule) — подстраховка почти через час, чтобы точно
    # забрать очередь (queue/*-dobor.txt) в эту же ночь.
    - cron: '10 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '80'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-ys/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-ys/state tools/yandex-positions-ikigaiauto-ys/queue
          git commit -m "ikigaiauto-ys positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY }}
          YANDEX_FOLDER_ID: b1g4gqlmtd9mncfea3tk
          YP_REGION: '80'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-ys/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-ys/results
          git commit -m "ikigaiauto-ys positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
