name: yandex-positions-ikigaiauto-ys-submit

on:
  schedule:
    # 00:45 МСК = 21:45 UTC (cron-job.org реально бьёт в 00:50 МСК/21:50 UTC).
    # Сдвиг от ikigaiauto-vl (00:05) и pm (01:35) — все три делят один ключ
    # rf-konsalt, одновременно нельзя.
    # ⚠️ 21-22.11.2026: schedule не сработал ни разу всю ночь — см. комментарий
    # в vl-submit.yml. Основной способ запуска — repository_dispatch ниже.
    - cron: '45 21 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [ikigaiauto-ys-nightly-submit]

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Submit async position requests
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '80'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-ys/positions.py submit
      - name: Commit state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-ys/state tools/yandex-positions-ikigaiauto-ys/queue
          git commit -m "ikigaiauto-ys positions: submit $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)

      - name: Wait for async processing
        if: always()
        run: sleep 300
      - name: Collect results (parallel, early grab)
        if: always()
        env:
          YANDEX_SEARCH_API_KEY: ${{ secrets.YANDEX_SEARCH_API_KEY_RFKONSALT }}
          YANDEX_FOLDER_ID: b1g08otc7dmb1kq48mc8
          YP_REGION: '80'
          YP_SITE: 'ikigaiauto.ru'
        run: python tools/yandex-positions-ikigaiauto-ys/collect_parallel.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/yandex-positions-ikigaiauto-ys/results
          git commit -m "ikigaiauto-ys positions: early collect $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git push || (git fetch origin main && git rebase origin/main && git push)
